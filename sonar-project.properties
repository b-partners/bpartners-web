sonar.host.url=https://sonarcloud.io
sonar.organization=bpartners
sonar.projectKey=bpartners-web

sonar.sources=./src/
sonar.tests=./src/__tests__/,./src/common/utils/__tests__/
sonar.testExecutionReportPaths=./dist/test-reports.xml
# sonar.tests overlaps sonar.sources so test files must be manually
# excluded from sources and included in tests. Co-located *.cy.ts(x) files
# (e.g. src/providers/draft-area-annotations-provider.cy.ts) are tests too,
# not just files under __tests__/.
sonar.exclusions=**/__tests__/**,**/*.cy.ts,**/*.cy.tsx
sonar.test.inclusions=**/__tests__/**,**/*.cy.ts,**/*.cy.tsx

sonar.javascript.lcov.reportPaths=./coverage/lcov.info
