name: Instatus Detection monitoring
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  PROD_USERPOOL_ID: eu-west-3_FRKp6Y3Gx
  PROD_WEBCLIENT_ID: 1rof83p44k83l5lc8gfk6sbtam
  PROD_OAUTH_DOMAIN: bpartners.auth.eu-west-3.amazoncognito.com
  PROD_REDIRECT_SUCCESS: https://dashboard.bpartners.app/login/success
  PREPROD_USERPOOL_ID: eu-west-3_Fv8n7AfVo
  PREPROD_WEBCLIENT_ID: 4v0n3pk2j0b12m3aascud4us6h
  PREPROD_OAUTH_DOMAIN: preprod-bpartners-api.auth.eu-west-3.amazoncognito.com
  PREPROD_REDIRECT_SUCCESS: https://dashboard.preprod.bpartners.app/login/success
  REACT_APP_ANNOTATOR_GEO_CONVERTER_API_URL: https://tile-referencer.azurewebsites.net
  REACT_APP_ANNOTATOR_PIXEL_CONVERTER_API_URL: https://q1xs10we5d.execute-api.eu-west-3.amazonaws.com/Prod

jobs:
  monitor-roof-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
      - name: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          verbose: false
          arch: amd64
          rootdir: ''
          workdir: ''
      - name: Connect to Bpartners Imagery AWS CodeArtifact
        run: |
          sh ./initAWS.sh imagery ${{ secrets.BPARTNERS_IMAGERY_AWS_ACCESS_KEY_ID }} ${{ secrets.BPARTNERS_IMAGERY_AWS_SECRET_ACCESS_KEY }} eu-west-3
          sh ./initNpmrc.sh imagery annotator-imagery-store npm-bpartners-imagery-app 205205101409
      - name: Connect to HEI AWS CodeArtifact
        run: |
          sh ./initAWS.sh hei ${{ secrets.HEI_AWS_ACCESS_KEY_ID }} ${{ secrets.HEI_AWS_SECRET_ACCESS_KEY }} ${{ secrets.HEI_AWS_REGION }}
          sh ./initNpmrc.sh hei hei-store npm-hei-school 088312068315
      - name: Connect to BPartners AWS CodeArtifact
        run: |
          sh ./initAWS.sh bpartners ${{ secrets.BPARTNERS_AWS_ACCESS_KEY_ID }} ${{ secrets.BPARTNERS_AWS_SECRET_ACCESS_KEY }} ${{ secrets.BPARTNERS_AWS_REGION }}
          sh ./initNpmrc.sh bpartners bpartners-store npm-bpartners-app 688605879718
      - run: npm install --legacy-peer-deps
      - run: |
          echo REACT_APP_ANNOTATOR_GEO_CONVERTER_API_URL=${{ env.REACT_APP_ANNOTATOR_GEO_CONVERTER_API_URL }} > .env
          echo REACT_APP_ANNOTATOR_PIXEL_CONVERTER_API_URL=${{ env.REACT_APP_ANNOTATOR_PIXEL_CONVERTER_API_URL }} >> .env
          echo REACT_APP_AWS_REGION=${{ env.AWS_REGION }} >> .env
          echo REACT_APP_IT_ONBOARD_USERNAME=${{ secrets.REACT_APP_IT_ONBOARD_USERNAME }}  >> .env
          echo REACT_APP_IT_ONBOARD_PASSWORD_1=${{ secrets.REACT_APP_IT_ONBOARD_PASSWORD_1 }}  >> .env
          echo REACT_APP_IT_ONBOARD_PHONE_NUMBER=${{ secrets.REACT_APP_IT_ONBOARD_PHONE_NUMBER }} >> .env

          if ${{ github.ref_name == 'prod' }}; then
            echo REACT_APP_USERPOOL_ID=${{ env.PROD_USERPOOL_ID }} >> .env
            echo REACT_APP_WEBCLIENT_ID=${{ env.PROD_WEBCLIENT_ID }} >> .env
            echo REACT_APP_OAUTH_DOMAIN=${{ env.PROD_OAUTH_DOMAIN }} >> .env
            echo REACT_APP_REDIRECT_SUCCESS=${{ env.PROD_REDIRECT_SUCCESS }} >> .env
          else
            echo REACT_APP_USERPOOL_ID=${{ env.PREPROD_USERPOOL_ID }} >> .env
            echo REACT_APP_WEBCLIENT_ID=${{ env.PREPROD_WEBCLIENT_ID }} >> .env
            echo REACT_APP_OAUTH_DOMAIN=${{ env.PREPROD_OAUTH_DOMAIN }} >> .env
            echo REACT_APP_REDIRECT_SUCCESS=${{ env.PREPROD_REDIRECT_SUCCESS }} >> .env
          fi

      - name: Clean previous reports
        run: rm -rf dist

      - name: Launch Roof detection analysis 1 IT
        id: detection-1
        run: npx cypress run --browser chrome --headless --spec "src/__tests__/it/annotator/analyse-address-1.it.cy.ts"
        continue-on-error: true

      - run: mv cypress/results/annotator-timings.json cypress/results/analyse-address-1-timing.json

      - name: Launch Roof detection analysis 2 IT
        id: detection-2
        run: npx cypress run --browser chrome --headless --spec "src/__tests__/it/annotator/analyse-address-2.it.cy.ts"
        continue-on-error: true

      - run: mv cypress/results/annotator-timings.json cypress/results/analyse-address-2-timing.json

      - name: Launch Roof detection analysis 3 IT
        id: detection-3
        run: npx cypress run --browser chrome --headless --spec "src/__tests__/it/annotator/analyse-address-3.it.cy.ts"
        continue-on-error: true

      - run: mv cypress/results/annotator-timings.json cypress/results/analyse-address-3-timing.json

      - name: Monitor Roof analysis on Instatus
        env:
          INSTATUS_API_KEY: ${{ secrets.INSTATUS_API_KEY }}
          INSTATUS_PAGE_ID: ${{ secrets.INSTATUS_PAGE_ID }}
          INSTATUS_COMPONENT_ID: ${{ secrets.INSTATUS_DETECTION_COMPONENT_ID }}
          INSTATUS_DETECTION_RESTORED_TMPL_ID: ${{ secrets.INSTATUS_DETECTION_RESTORED_TMPL_ID }}
        shell: bash
        run: |
          set -euo pipefail

          REPORTS=$(find dist -type f -name "*.xml" | grep -E "analyse-address.*\.cy\.ts\.xml" || true)

          if [ -z "$REPORTS" ]; then
            echo "No Detection report files found"
            exit 1
          fi

          ERROR_MESSAGE=$(python3 - "$REPORTS" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          files = sys.argv[1].splitlines()

          messages = []

          for file in files:
              try:
                  tree = ET.parse(file)
                  root = tree.getroot()

                  nodes = root.findall(".//failure") + root.findall(".//error")

                  for node in nodes:
                      msg = node.attrib.get("message", "").strip()
                      if not msg:
                          msg = (node.text or "").strip()

                      if msg:
                          msg = msg.replace("\n", " ")
                          messages.append(f"[{file}] {msg[:800]}")

              except Exception as e:
                  messages.append(f"[{file}] XML parse error: {str(e)}")

          print("\n".join(messages)[:4000])
          PY
          )

          SLOW_GENERATION_MESSAGE=$(python3 <<'PY'
          import json
          import glob

          MAX_DURATION_MS = 120000

          messages = []

          for file in glob.glob("cypress/results/*-timing.json"):
              try:
                  with open(file) as f:
                      report = json.load(f)

                  for timing in report.get("timings", []):
                      duration = timing.get("ms", 0)
                      if duration > MAX_DURATION_MS:
                          messages.append(
                              f"[{file}] "
                              f"{timing.get('spec')} - "
                              f"{timing.get('step')} took "
                              f"{duration}ms"
                          )

              except Exception as e:
                  messages.append(
                      f"[{file}] JSON parse error: {str(e)}"
                  )
          print("\n".join(messages)[:4000])
          PY
          )

          if [ -n "$ERROR_MESSAGE" ]; then
            HAS_ERROR=true
          else
            HAS_ERROR=false
          fi

          if [ -n "$SLOW_GENERATION_MESSAGE" ]; then
            HAS_SLOW_GENERATION=true
          else
            HAS_SLOW_GENERATION=false
          fi

          ACTIVE_INCIDENT_ID=$(curl -fsSL \
            -H "Authorization: Bearer ${INSTATUS_API_KEY}" \
            "https://api.instatus.com/v1/${INSTATUS_PAGE_ID}/incidents" \
            | jq -r \
              --arg COMPONENT "$INSTATUS_COMPONENT_ID" '
                map(
                  select(
                    (.status != "RESOLVED")
                    and (
                      (.components // [])
                      | map(.id)
                      | index($COMPONENT)
                    )
                  )
                )
                | first
                | .id // empty
              ')

          if [ "$HAS_ERROR" = true ]; then
            if [ -n "$ACTIVE_INCIDENT_ID" ]; then
              echo "Incident already active: $ACTIVE_INCIDENT_ID"
            else
              echo "Creating MAJOR outage incident..."

              PAYLOAD=$(jq -n \
                --arg message "$ERROR_MESSAGE" \
                --arg component "$INSTATUS_COMPONENT_ID" \
                '{
                  name: "[Roof analysis] Failed to process roof analysis",
                  status: "INVESTIGATING",
                  message: $message,
                  components: [$component],
                  statuses: [
                    {
                      id: $component,
                      status: "MAJOROUTAGE"
                    }
                  ]
                }')

              curl -fsSL \
                -X POST \
                -H "Authorization: Bearer ${INSTATUS_API_KEY}" \
                -H "Content-Type: application/json" \
                "https://api.instatus.com/v1/${INSTATUS_PAGE_ID}/incidents" \
                -d "$PAYLOAD"

            fi

          elif [ "$HAS_SLOW_GENERATION" = true ]; then
            if [ -n "$ACTIVE_INCIDENT_ID" ]; then
              echo "Incident already active: $ACTIVE_INCIDENT_ID"
            else
              echo "Creating PARTIAL outage incident..."
              PAYLOAD=$(jq -n \
                --arg message "$SLOW_GENERATION_MESSAGE" \
                --arg component "$INSTATUS_COMPONENT_ID" \
                '{
                  name: "[Roof analysis] Took too much time to process",
                  status: "INVESTIGATING",
                  message: $message,
                  components: [$component],
                  statuses: [{id: $component, status: "PARTIALOUTAGE"}]
                }')

              curl -fsSL \
                -X POST \
                -H "Authorization: Bearer ${INSTATUS_API_KEY}" \
                -H "Content-Type: application/json" \
                "https://api.instatus.com/v1/${INSTATUS_PAGE_ID}/incidents" \
                -d "$PAYLOAD"
            fi
          else
            if [ -n "$ACTIVE_INCIDENT_ID" ]; then
              echo "Resolving incident $ACTIVE_INCIDENT_ID..."
              curl -s -o /dev/null \
                -X POST \
                "https://api.instatus.com/v2/${INSTATUS_PAGE_ID}/incidents/${ACTIVE_INCIDENT_ID}/incident-updates/${INSTATUS_3D_RESTORED_TMPL_ID}" \
                -H "Authorization: Bearer ${INSTATUS_API_KEY}"
            else
              echo "No active incident."
            fi
          fi

      - name: Upload cypress video to S3
        if: ${{ always() && (steps.detection-1.outcome == 'failure' || steps.detection-2.outcome == 'failure' || steps.detection-3.outcome == 'failure') }}
        run: |
          aws s3 cp cypress/videos/ s3://${{ secrets.CYPRESS_S3_BUCKET }}/cypress-detection-videos/$(date +%Y-%m-%d_%H-%M-%S)/ --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BPARTNERS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BPARTNERS_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BPARTNERS_AWS_REGION }}
