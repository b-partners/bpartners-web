name: IT
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - 'prod'
  pull_request:
    branches:
      - 'prod'

env:
  AWS_REGION: eu-west-3
  PROD_USERPOOL_ID: eu-west-3_FRKp6Y3Gx
  PROD_WEBCLIENT_ID: 1rof83p44k83l5lc8gfk6sbtam
  PROD_OAUTH_DOMAIN: bpartners.auth.eu-west-3.amazoncognito.com
  PROD_REDIRECT_SUCCESS: https://dashboard.bpartners.app/login/success

jobs:
  tests:
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1.0.3
        with:
          version: 2
          verbose: false
          arch: amd64
          rootdir: ''
          workdir: ''
      - name: Get Time
        id: current-time
        uses: nanzm/get-time-action@v1.1
        with:
          timeZone: 3
          format: 'YYYY-MM-DD-HH-mm-ss'
      - name: Set time as env
        run: echo "time=${{ steps.current-time.outputs.time }}" >> $GITHUB_ENV
      - name: Connect to Bpartners Imagery AWS CodeArtifact
        run: |
          sh ./initAWS.sh imagery ${{ secrets.BPARTNERS_IMAGERY_AWS_ACCESS_KEY_ID }} ${{ secrets.BPARTNERS_IMAGERY_AWS_SECRET_ACCESS_KEY }} eu-west-3
          sh ./initNpmrc.sh imagery annotator-imagery-store npm-bpartners-imagery-app 205205101409
      - name: Connect to HEI AWS CodeArtifact
        run: |
          sh ./initAWS.sh hei ${{ secrets.HEI_AWS_ACCESS_KEY_ID }} ${{ secrets.HEI_AWS_SECRET_ACCESS_KEY }} ${{ secrets.HEI_AWS_REGION }}
          sh ./initNpmrc.sh hei hei-store npm-hei-school 088312068315
      - name: Connect to BPartners AWS CodeArtifact
        run: |
          sh ./initAWS.sh bpartners ${{ secrets.BPARTNERS_AWS_ACCESS_KEY_ID }} ${{ secrets.BPARTNERS_AWS_SECRET_ACCESS_KEY }} ${{ secrets.BPARTNERS_AWS_REGION }}
          sh ./initNpmrc.sh bpartners bpartners-store npm-bpartners-app 688605879718
      - run: npm install --legacy-peer-deps
      - run: |
          echo REACT_APP_AWS_REGION=${{ env.AWS_REGION }} > .env
          echo REACT_APP_USERPOOL_ID=${{ env.PROD_USERPOOL_ID }} >> .env
          echo REACT_APP_WEBCLIENT_ID=${{ env.PROD_WEBCLIENT_ID }} >> .env
          echo REACT_APP_OAUTH_DOMAIN=${{ env.PROD_OAUTH_DOMAIN }} >> .env
          echo REACT_APP_REDIRECT_SUCCESS=${{ env.PROD_REDIRECT_SUCCESS }} >> .env
          echo REACT_APP_BPARTNERS_API_URL=https://api.prod.bpartners.app >> .env
          echo REACT_APP_IT_USERNAME=${{ secrets.IT_USERNAME }} >> .env
          echo REACT_APP_IT_PASSWORD='${{ secrets.IT_PASSWORD }}' >> .env
          echo REACT_APP_PROD_URL='${{ secrets.REACT_APP_PROD_URL }}' >> .env
          echo REACT_APP_IT_ONBOARD_USERNAME=${{ secrets.REACT_APP_IT_ONBOARD_USERNAME }}  >> .env
          echo REACT_APP_IT_ONBOARD_PASSWORD_1=${{ secrets.REACT_APP_IT_ONBOARD_PASSWORD_1 }}  >> .env
          echo REACT_APP_IT_ONBOARD_PHONE_NUMBER=${{ secrets.REACT_APP_IT_ONBOARD_PHONE_NUMBER }} >> .env
          echo INSTATUS_API_KEY=${{ secrets.INSTATUS_API_KEY }} >> .env
          echo INSTATUS_PAGE_ID=${{ secrets.INSTATUS_PAGE_ID }} >> .env
          echo INSTATUS_3D_COMPONENT_ID=${{secrets.INSTATUS_3D_COMPONENT_ID}} >> .env

          max_retries=5
          attempt=1

          until npm run it
          do
            if [ $attempt -ge $max_retries ]; then
              echo "Tests failed after $attempt attempts."
              exit 1
            fi
            echo "Test failed. Retrying attempt $((attempt+1)) of $max_retries..."
            attempt=$((attempt+1))
            sleep 5
          done

        id: it-test
      - name: Remove last user
        run: curl -X DELETE https://api.preprod.bpartners.app/dummy-user
        continue-on-error: true
        if: always()
      - name: Show test repports
        if: always()
        run: find "./dist/src/__tests__/it" -iname "*xml" -exec cat {} +
      - name: Upload video to s3 if failure
        if: ${{ always() && steps.it-test.outcome == 'failure' }}
        run: aws s3 cp ./cypress/videos/__tests__/it/ s3://bpartners-web-it-videos/${{ env.time }}/ --recursive --profile bpartners
  notification:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1.0.3
        with:
          version: 2
          verbose: false
          arch: amd64
          rootdir: ''
          workdir: ''
      - run: sh ./initAWS.sh bpartners ${{ secrets.BPARTNERS_AWS_ACCESS_KEY_ID }} ${{ secrets.BPARTNERS_AWS_SECRET_ACCESS_KEY }} ${{ secrets.BPARTNERS_AWS_REGION }}
      - uses: martialonline/workflow-status@v3
        id: check_status
      - run: echo "action_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
      - name: Send mail to specified recipients on test failure
        if: steps.check_status.outputs.status == 'failure'
        run: |
          sed -i 's|<ACTION_LINK>|${{ env.action_url }}|g' ./conf/email-template.json
          sh ./conf/send-email.sh bpartners
