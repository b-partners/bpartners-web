name: CI
on: [push, pull_request, workflow_dispatch]

env:
  AWS_REGION: eu-west-3
  PROD_USERPOOL_ID: eu-west-3_FRKp6Y3Gx
  PROD_WEBCLIENT_ID: 1rof83p44k83l5lc8gfk6sbtam
  PROD_OAUTH_DOMAIN: bpartners.auth.eu-west-3.amazoncognito.com
  PROD_REDIRECT_SUCCESS: https://dashboard.bpartners.app/login/success
  PREPROD_USERPOOL_ID: eu-west-3_Fv8n7AfVo
  PREPROD_WEBCLIENT_ID: 4v0n3pk2j0b12m3aascud4us6h
  PREPROD_OAUTH_DOMAIN: preprod-bpartners-api.auth.eu-west-3.amazoncognito.com
  PREPROD_REDIRECT_SUCCESS: https://dashboard.preprod.bpartners.app/login/success
  REACT_APP_ANNOTATOR_GEO_CONVERTER_API_URL: https://tile-referencer.azurewebsites.net
  REACT_APP_ANNOTATOR_PIXEL_CONVERTER_API_URL: https://q1xs10we5d.execute-api.eu-west-3.amazonaws.com/Prod
  SHARDS: 4

jobs:
  tests:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure says nothing about the others, and Sonar wants every shard's report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-
      - name: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          verbose: false
          arch: amd64
          rootdir: ''
          workdir: ''
      - name: Connect to Bpartners Imagery AWS CodeArtifact
        run: |
          sh ./initAWS.sh imagery ${{ secrets.BPARTNERS_IMAGERY_AWS_ACCESS_KEY_ID }} ${{ secrets.BPARTNERS_IMAGERY_AWS_SECRET_ACCESS_KEY }} eu-west-3
          sh ./initNpmrc.sh imagery annotator-imagery-store npm-bpartners-imagery-app 205205101409
      - name: Connect to HEI AWS CodeArtifact
        run: |
          sh ./initAWS.sh hei ${{ secrets.HEI_AWS_ACCESS_KEY_ID }} ${{ secrets.HEI_AWS_SECRET_ACCESS_KEY }} ${{ secrets.HEI_AWS_REGION }}
          sh ./initNpmrc.sh hei hei-store npm-hei-school 088312068315
      - name: Connect to BPartners AWS CodeArtifact
        run: |
          sh ./initAWS.sh bpartners ${{ secrets.BPARTNERS_AWS_ACCESS_KEY_ID }} ${{ secrets.BPARTNERS_AWS_SECRET_ACCESS_KEY }} ${{ secrets.BPARTNERS_AWS_REGION }}
          sh ./initNpmrc.sh bpartners bpartners-store npm-bpartners-app 688605879718
      - run: npm install --legacy-peer-deps
      - name: Add env
        run: |
          echo REACT_APP_ANNOTATOR_GEO_CONVERTER_API_URL=${{ env.REACT_APP_ANNOTATOR_GEO_CONVERTER_API_URL }} > .env
          echo REACT_APP_ANNOTATOR_PIXEL_CONVERTER_API_URL=${{ env.REACT_APP_ANNOTATOR_PIXEL_CONVERTER_API_URL }} >> .env
          echo REACT_APP_BPARTNERS_API_URL=https://api.dashboard.birdia.fr >> .env
          echo REACT_APP_AWS_REGION=${{ env.AWS_REGION }} >> .env
          echo REACT_APP_IT_ONBOARD_USERNAME=${{ secrets.REACT_APP_IT_ONBOARD_USERNAME }}  >> .env
          echo REACT_APP_IT_ONBOARD_PASSWORD_1=${{ secrets.REACT_APP_IT_ONBOARD_PASSWORD_1 }}  >> .env
          echo REACT_APP_IT_ONBOARD_PHONE_NUMBER=${{ secrets.REACT_APP_IT_ONBOARD_PHONE_NUMBER }} >> .env
          echo INSTATUS_API_KEY=${{ secrets.INSTATUS_API_KEY }} >> .env
          echo INSTATUS_PAGE_ID=${{ secrets.INSTATUS_PAGE_ID }} >> .env
          echo INSTATUS_3D_COMPONENT_ID=${{secrets.INSTATUS_3D_COMPONENT_ID}} >> .env
          echo EXCLUDE_INSTATUS_IT_SPEC=true >> .env
          echo INSTATUS_DETECTION_COMPONENT_ID=${{secrets.INSTATUS_DETECTION_COMPONENT_ID}} >> .env
          echo REACT_APP_SUBSCRIPTION_CANCELLATION=true >> .env

          if ${{ github.ref_name == 'prod' }}; then
            echo REACT_APP_USERPOOL_ID=${{ env.PROD_USERPOOL_ID }} >> .env
            echo REACT_APP_WEBCLIENT_ID=${{ env.PROD_WEBCLIENT_ID }} >> .env
            echo REACT_APP_OAUTH_DOMAIN=${{ env.PROD_OAUTH_DOMAIN }} >> .env
            echo REACT_APP_REDIRECT_SUCCESS=${{ env.PROD_REDIRECT_SUCCESS }} >> .env
          else
            echo REACT_APP_USERPOOL_ID=${{ env.PREPROD_USERPOOL_ID }} >> .env
            echo REACT_APP_WEBCLIENT_ID=${{ env.PREPROD_WEBCLIENT_ID }} >> .env
            echo REACT_APP_OAUTH_DOMAIN=${{ env.PREPROD_OAUTH_DOMAIN }} >> .env
            echo REACT_APP_REDIRECT_SUCCESS=${{ env.PREPROD_REDIRECT_SUCCESS }} >> .env
          fi

      - name: Run the component specs of this shard
        env:
          # Instrumentation is gated in vite.config.ts; the coverage run is the one that asks for it.
          CYPRESS_COVERAGE: 'true'
        run: |
          specs=$(find src -name "*.cy.*" ! -name "*.it.cy.*" | sort | awk -v shard=${{ matrix.shard }} -v shards=${{ env.SHARDS }} 'NR % shards == shard % shards' | paste -sd, -)
          echo "shard ${{ matrix.shard }}/${{ env.SHARDS }}: $(echo "$specs" | tr ',' '\n' | wc -l) specs"
          npm test -- --spec "$specs"

      - name: Upload this shard's test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.shard }}
          path: dist/
          retention-days: 1
      - name: Upload this shard's coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: .nyc_output/out.json
          retention-days: 1
          if-no-files-found: warn
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ matrix.shard }}
          path: cypress/screenshots/

  sonar:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [tests]
    # The shards' reports are worth publishing even when one of them went red.
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Collect the shards' test reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-*
          path: dist/
          merge-multiple: true
      - name: Collect the shards' coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: nyc-shards/

      # srm and nyc are the only two packages this job needs, so it skips the project's own install.
      - name: Merge the test reports
        run: npx -y @skodaflow/sonar-report-merger@1.0.2 ./dist/test-reports.xml "./dist/**/!(*test-reports).xml"
      - name: Merge the coverage
        run: |
          mkdir -p nyc-merge-input .nyc_output coverage
          find nyc-shards -name out.json | nl -w1 -s' ' | while read -r index file; do cp "$file" "nyc-merge-input/$index.json"; done
          npx -y nyc@15.1.0 merge nyc-merge-input .nyc_output/out.json
          npx -y nyc@15.1.0 report --reporter=lcov --report-dir coverage

      - name: Read version file
        id: read-version
        uses: CumulusDS/get-yaml-paths-action@v0.1.0
        with:
          file: version.yml
          version: version

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - run: npm install --location=global sonar-scanner
      - name: Sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectVersion=${{ steps.read-version.outputs.version }} \
            -Dsonar.branch.name=${GITHUB_REF##*/}

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 17.x

      - run: rm package.json package-lock.json

      - run: |
          npm init -y
          npm install -d prettier@3.2.5 prettier-plugin-organize-imports@3.2.4

      - run: npx prettier --config ".prettierrc.json" --check "src/**/*.{js,ts,tsx}" "./**/*.{json,yml,yaml}"

  build:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm

      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1.0.3
        with:
          version: 2
          verbose: false
          arch: amd64
          rootdir: ''
          workdir: ''
      - name: Connect to Bpartners Imagery AWS CodeArtifact
        run: |
          sh ./initAWS.sh imagery ${{ secrets.BPARTNERS_IMAGERY_AWS_ACCESS_KEY_ID }} ${{ secrets.BPARTNERS_IMAGERY_AWS_SECRET_ACCESS_KEY }} eu-west-3
          sh ./initNpmrc.sh imagery annotator-imagery-store npm-bpartners-imagery-app 205205101409

      - name: Connect to HEI AWS CodeArtifact
        run: |
          sh ./initAWS.sh hei ${{ secrets.HEI_AWS_ACCESS_KEY_ID }} ${{ secrets.HEI_AWS_SECRET_ACCESS_KEY }} ${{ secrets.HEI_AWS_REGION }}
          sh ./initNpmrc.sh hei hei-store npm-hei-school 088312068315

      - name: Connect to BPartners AWS CodeArtifact
        run: |
          sh ./initAWS.sh bpartners ${{ secrets.BPARTNERS_AWS_ACCESS_KEY_ID }} ${{ secrets.BPARTNERS_AWS_SECRET_ACCESS_KEY }} ${{ secrets.BPARTNERS_AWS_REGION }}
          sh ./initNpmrc.sh bpartners bpartners-store npm-bpartners-app 688605879718

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Add env
        run: |
          echo REACT_APP_ANNOTATOR_GEO_CONVERTER_API_URL=${{ env.REACT_APP_ANNOTATOR_GEO_CONVERTER_API_URL }} > .env
          echo REACT_APP_ANNOTATOR_PIXEL_CONVERTER_API_URL=${{ env.REACT_APP_ANNOTATOR_PIXEL_CONVERTER_API_URL }} >> .env
          echo REACT_APP_AWS_REGION=${{ env.AWS_REGION }} >> .env
          echo REACT_APP_IT_ONBOARD_USERNAME=${{ secrets.REACT_APP_IT_ONBOARD_USERNAME }}  >> .env
          echo REACT_APP_IT_ONBOARD_PASSWORD_1=${{ secrets.REACT_APP_IT_ONBOARD_PASSWORD_1 }}  >> .env
          echo REACT_APP_IT_ONBOARD_PHONE_NUMBER=${{ secrets.REACT_APP_IT_ONBOARD_PHONE_NUMBER }} >> .env

          if ${{ github.ref_name == 'prod' }}; then
            echo REACT_APP_USERPOOL_ID=${{ env.PROD_USERPOOL_ID }} >> .env
            echo REACT_APP_WEBCLIENT_ID=${{ env.PROD_WEBCLIENT_ID }} >> .env
            echo REACT_APP_OAUTH_DOMAIN=${{ env.PROD_OAUTH_DOMAIN }} >> .env
            echo REACT_APP_REDIRECT_SUCCESS=${{ env.PROD_REDIRECT_SUCCESS }} >> .env
          else
            echo REACT_APP_USERPOOL_ID=${{ env.PREPROD_USERPOOL_ID }} >> .env
            echo REACT_APP_WEBCLIENT_ID=${{ env.PREPROD_WEBCLIENT_ID }} >> .env
            echo REACT_APP_OAUTH_DOMAIN=${{ env.PREPROD_OAUTH_DOMAIN }} >> .env
            echo REACT_APP_REDIRECT_SUCCESS=${{ env.PREPROD_REDIRECT_SUCCESS }} >> .env
          fi

      - name: Build app
        run: npm run build
